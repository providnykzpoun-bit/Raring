<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA HUB | Підтримка</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f1a; color: #e2e8f0; margin: 0; padding: 0; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        .lang-switcher { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .lang-btn { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .lang-btn:hover { border-color: #fbbf24; }

        header { padding: 10px 0; }
        h1 { color: #fff; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }

        /* Стиль для рекламного блоку */
        #ad-space { width: 100%; margin: 15px 0; min-height: 50px; }

        .donate-card { 
            background: #1e293b; border: 1px solid #334155; border-radius: 15px; 
            padding: 20px; text-align: center; margin-bottom: 20px;
        }
        .donate-title { color: #fbbf24; font-size: 18px; font-weight: bold; margin-bottom: 15px; }
        .wallet-address { 
            background: #0b0f1a; padding: 12px; border-radius: 8px; 
            font-family: monospace; font-size: 12px; word-break: break-all; 
            border: 1px solid #334155; color: #fbbf24; margin-bottom: 15px;
        }
        .btn-copy { 
            background: #334155; color: #fff; border: none; padding: 8px 15px; 
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold;
        }
        .btn-copy:hover { background: #475569; }

        .back-link { display: inline-block; margin-top: 30px; color: #94a3b8; text-decoration: none; font-size: 14px; padding: 10px 20px; border: 1px solid #334155; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-switcher">
        <button class="lang-btn" onclick="setLang('uk')">🇺🇦 UA</button>
        <button class="lang-btn" onclick="setLang('en')">🇺🇸 EN</button>
        <button class="lang-btn" onclick="setLang('pl')">🇵🇱 PL</button>
        <button class="lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
        <button class="lang-btn" onclick="setLang('fr')">🇫🇷 FR</button>
    </div>

    <header>
        <h1 id="title">Підтримка UA HUB</h1>
        <p id="subtitle" class="subtitle">Ваші донати допомагають нам розвиватися</p>
    </header>

    <div id="ad-space"></div>

    <div class="donate-card">
        <div class="donate-title">TON / UA Token (TON Network)</div>
        <div class="wallet-address" id="wallet">EQDqC7e4o5pzIWm3PfDQr3l96epyBezSn7dPjpCJ8GwAwnh9</div>
        <button class="btn-copy" onclick="copyWallet()" id="btn-copy">Копіювати адресу</button>
    </div>

    <p style="font-size: 12px; color: #94a3b8; line-height: 1.5;">
        Всі зібрані кошти йдуть на ліквідність токена та розробку нових сервісів для спільноти. Дякуємо за вашу підтримку!
    </p>

    <a href="index.html" id="back-btn" class="back-link">← Повернутися</a>
</div>

<script>
    const translations = {
        uk: {
            title: "Підтримка UA HUB", subtitle: "Ваші донати допомагають нам розвиватися",
            copy: "Копіювати адресу", back: "← Повернутися"
        },
        en: {
            title: "Support UA HUB", subtitle: "Your donations help us grow",
            copy: "Copy address", back: "← Back"
        },
        pl: {
            title: "Wsparcie UA HUB", subtitle: "Twoje darowizny pomagają nam się rozwijać",
            copy: "Kopiuj adres", back: "← Powrót"
        },
        de: {
            title: "UA HUB unterstützen", subtitle: "Ihre Spenden helfen uns beim Wachsen",
            copy: "Adresse kopieren", back: "← Zurück"
        },
        fr: {
            title: "Soutenir UA HUB", subtitle: "Vos dons nous aident à grandir",
            copy: "Copier l'adresse", back: "← Retour"
        }
    };

    function setLang(lang) {
        document.getElementById('title').innerText = translations[lang].title;
        document.getElementById('subtitle').innerText = translations[lang].subtitle;
        document.getElementById('btn-copy').innerText = translations[lang].copy;
        document.getElementById('back-btn').innerText = translations[lang].back;
    }

    function copyWallet() {
        const walletText = document.getElementById('wallet').innerText;
        navigator.clipboard.writeText(walletText).then(() => {
            alert("Адресу скопійовано!");
        });
    }
</script>

<script src="ads.js"></script>

</body>
</html>
