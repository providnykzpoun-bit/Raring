<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг ТГ Каналів</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; background: #f4f4f9; }
        h1 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #007bff; color: white; }
        tr:hover { background: #f1f1f1; }
        .btn { display: block; width: fit-content; margin: 20px auto; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>🏆 Рейтинг Telegram Каналів</h1>
    
    <table>
        <thead>
            <tr>
                <th>Назва</th>
                <th>Категорія</th>
                <th>Рейтинг</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><a href="https://t.me/example">Приклад Каналу</a></td>
                <td>Новини</td>
                <td>⭐ 5.0</td>
            </tr>
        </tbody>
    </table>

    <a href="https://github.com/providnykzpoun-bit/Raring/edit/main/index.html" class="btn">➕ Додати свій канал</a>

</body>
</html>
