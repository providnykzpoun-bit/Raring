<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Lottery - Рейтинг</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #3b82f6; font-size: 24px; }
        .input-group { display: flex; gap: 8px; margin-top: 15px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 10px; font-size: 14px; min-height: 20px; }
        #logspot-board { min-height: 400px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Рейтинг UA Каналів</h1>

    <div class="card">
        <h3>Додати свій канал:</h3>
        <div class="input-group">
            <input type="text" id="chanInput" placeholder="@назва або посилання">
            <button onclick="fastSend()">Додати</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="card">
        <div id="logspot-board" data-logspot-board="rating"></div>
    </div>
</div>

<script>
    async function fastSend() {
        const input = document.getElementById('chanInput');
        const status = document.getElementById('status');
        const val = input.value.trim();

        if (!val) {
            status.innerText = "⚠️ Введи назву!";
            status.style.color = "#fbbf24";
            return;
        }

        status.innerText = "Відправка...";
        status.style.color = "#94a3b8";

        try {
            // Прямий запит до API без очікування завантаження скриптів
            const response = await fetch('https://api.logspot.io/v1/projects/rating/events', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Logspot-PK': 'pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj'
                },
                body: JSON.stringify({
                    channel: "web",
                    event: "new_submission",
                    message: val
                })
            });

            if (response.ok) {
                status.innerText = "✅ Надіслано! Перевір Events у Logspot.";
                status.style.color = "#4ade80";
                input.value = "";
            } else {
                throw new Error();
            }
        } catch (e) {
            status.innerText = "❌ Помилка. Спробуй ще раз через хвилину.";
            status.style.color = "#f87171";
        }
    }
</script>

<script async data-logspot-pk="pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj" src="https://cdn.logspot.io/lg.js"></script>

</body>
</html>
