<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA HUB — Торговий портал</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f1a; color: #e2e8f0; margin: 0; padding: 0; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* Заголовок */
        header { padding: 20px 0; }
        h1 { color: #fff; margin: 0; font-size: 28px; letter-spacing: 2px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-top: 5px; }

        /* Графік */
        .chart-container { background: #111827; border-radius: 12px; padding: 10px; border: 1px solid #334155; margin: 20px 0; }

        /* Секція Stars */
        .stars-section { 
            background: linear-gradient(135deg, #1e293b, #0f172a); 
            border: 2px solid #fbbf24; 
            border-radius: 20px; 
            padding: 20px; 
            margin: 25px 0;
        }
        .stars-title { color: #fbbf24; font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .rate-value { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 15px; }
        .btn-bot { 
            display: block; background: #fbbf24; color: #000; padding: 15px; 
            border-radius: 12px; text-decoration: none; font-weight: bold; transition: 0.3s;
        }

        /* Торгівля (Куплю/Продам) */
        .trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 25px 0; }
        .trade-box { background: #1e293b; border-radius: 15px; padding: 15px; border: 1px solid #334155; }
        .buy-title { color: #10b981; font-weight: bold; border-bottom: 1px solid #10b981; margin-bottom: 10px; padding-bottom: 5px; }
        .sell-title { color: #ef4444; font-weight: bold; border-bottom: 1px solid #ef4444; margin-bottom: 10px; padding-bottom: 5px; }
        .order-list { list-style: none; padding: 0; font-size: 13px; text-align: left; }
        .order-item { padding: 5px 0; border-bottom: 1px solid #2d3748; }

        /* Кнопка ігор */
        .games-link { 
            display: block; background: #4f46e5; color: white; padding: 15px; 
            border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>UA HUB</h1>
        <p class="subtitle">Єдиний центр екосистеми UA Token</p>
    </header>

    <div class="chart-container">
        <iframe src="https://www.dextools.io/widget-chart/en/ton/pe-light/EQDqC7e4o5pzIWm3PfDQr3l96epyBezSn7dPjpCJ8GwAwnh9?theme=dark&chartType=1&chartResolution=1&drawingToolbars=false&chartInUsd=true&headerColor=1F2937&tvPlatformColor=1F2937&tvPaneColor=1F2937" 
        width="100%" height="320" style="border:none; border-radius: 8px;"></iframe>
    </div>

    <div class="stars-section">
        <div class="stars-title">💎 Швидкий обмін Stars</div>
        <div class="rate-value">1 STARS = 10,000 UA</div>
        <a href="https://t.me/Anketkaua_bot?start=sub167543" target="_blank" class="btn-bot">🚀 КУПИТИ ЧЕРЕЗ БОТ</a>
    </div>

    <div class="trade-grid">
        <div class="trade-box">
            <div class="buy-title">КУПЛЮ</div>
            <ul class="order-list">
                <li class="order-item">🔹 500 UA @ 5.1$</li>
                <li class="order-item">🔹 1200 UA @ 5.0$</li>
            </ul>
        </div>
        <div class="trade-box">
            <div class="sell-title">ПРОДАМ</div>
            <ul class="order-list">
                <li class="order-item">🔸 300 UA @ 5.5$</li>
                <li class="order-item">🔸 100 UA @ 5.6$</li>
            </ul>
        </div>
    </div>

    <a href="games.html" class="games-link">🎮 ГРАЙ ТА ЗАРОБЛЯЙ UA</a>

    <p style="font-size: 11px; color: #4b5563; margin-top: 30px;">© 2026 UA HUB. All rights reserved.</p>
</div>

</body>
</html>
