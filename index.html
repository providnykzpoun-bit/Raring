<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Lottery - Рейтинг Каналів</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .container { max-width: 600px; margin: 0 auto; }
        .card { 
            background: #1e293b; 
            border-radius: 16px; 
            padding: 24px; 
            margin-bottom: 20px; 
            border: 1px solid #334155; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #f8fafc; }
        h3 { margin-top: 0; font-size: 18px; color: #cbd5e1; }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input { 
            flex: 1;
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a;
            color: white;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        
        button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #3b82f6; 
            color: white; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        
        #status { font-size: 14px; margin-top: 10px; min-height: 20px; }
        
        #logspot-board { 
            min-height: 400px; 
            margin-top: 10px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Рейтинг UA Каналів</h1>

    <div class="card">
        <h3>Додати свій канал</h3>
        <div class="input-group">
            <input type="text" id="channelName" placeholder="Наприклад, @my_channel">
            <button onclick="sendToLogspot()">Додати</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="card">
        <div id="logspot-board" data-logspot-board="rating"></div>
    </div>
    
    <div class="card">
        <h3>Графік TON/PE-LIGHT</h3>
        <iframe
          id="dextools-widget"
          title="DEXTools Trading Chart"
          width="100%"
          height="300"
          style="max-width: 100%; border-radius: 8px; border: 1px solid #333;"
          src="https://www.dextools.io/widget-chart/en/ton/pe-light/EQDqC7e4o5pzIWm3PfDQr3l96epyBezSn7dPjpCJ8GwAwnh9?theme=dark&chartType=1&chartResolution=1&drawingToolbars=false&chartInUsd=true&headerColor=1F2937&tvPlatformColor=1F2937&tvPaneColor=1F2937">
        </iframe>
    </div>
</div>

<script>
    async function sendToLogspot() {
        const nameField = document.getElementById('channelName');
        const status = document.getElementById('status');
        const name = nameField.value.trim();
        
        if (!name) {
            status.style.color = '#f87171';
            status.innerText = '⚠️ Будь ласка, введи назву!';
            return;
        }

        status.style.color = '#94a3b8';
        status.innerText = 'Зачекайте, додаємо...';

        try {
            // Використовуємо твої ключі та назву проекту 'rating'
            const response = await fetch('https://api.logspot.io/v1/projects/rating/events', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Logspot-PK': 'pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj',
                    'X-Logspot-SK': 'sk_a6GAP1Y507HsaAkZMIq9t44lGnlToJVV0aJCvr31'
                },
                body: JSON.stringify({
                    channel: "web-submissions",
                    event: "user_added_channel",
                    message: name
                })
            });

            if (response.ok) {
                status.style.color = '#4ade80';
                status.innerText = '✅ Канал успішно надіслано! Він з’явиться в списку після модерації.';
                nameField.value = '';
            } else {
                status.style.color = '#f87171';
                status.innerText = '❌ Помилка сервера. Перевір ключі в Logspot.';
            }
        } catch (e) {
            status.style.color = '#f87171';
            status.innerText = '❌ Помилка мережі. Спробуй пізніше.';
        }
    }
</script>

<script async data-logspot-pk="pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj" src="https://cdn.logspot.io/lg.js"></script>

</body>
</html>
