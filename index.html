<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг Телеграм Каналів</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        /* Стиль для таблиці (рейтингу) */
        .rating-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }
        .rating-table th, .rating-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        .rating-table th {
            background-color: #673ab7;
            color: white;
        }
        /* Стиль для блоку з анкетою */
        .form-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .form-header {
            background-color: #673ab7;
            color: white;
            padding: 15px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }
        iframe {
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 8px 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Топ Телеграм Каналів</h1>

    <table class="rating-table">
        <thead>
            <tr>
                <th>Місце</th>
                <th>Назва каналу</th>
                <th>Посилання</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Приклад каналу</td>
                <td><a href="#">@example</a></td>
            </tr>
            </tbody>
    </table>

    <div class="form-section">
        <div class="form-header">
            <h2 style="margin: 0; font-size: 18px;">Додати свій канал до списку</h2>
        </div>
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSc-IVzLsXqjQXLHrA0_xJBzd7hg3H5xdu_dgswZzD-EO5KQ5w/viewform?embedded=true" 
            width="100%" 
            height="700" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0">
            Завантаження...
        </iframe>
    </div>
</div>

</body>
</html>
