<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Lottery - Рейтинг</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #3b82f6; font-size: 24px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-top: 15px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; opacity: 0.6; }
        button.ready { opacity: 1; }
        #status { margin-top: 10px; font-size: 14px; min-height: 20px; }
        #logspot-board { min-height: 400px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Рейтинг UA Каналів</h1>

    <div class="card">
        <h3>Додати свій канал:</h3>
        <div class="input-group">
            <input type="text" id="chanInput" placeholder="Посилання або @username">
            <button id="sendBtn" onclick="sendData()" disabled>Чекаємо...</button>
        </div>
        <div id="status">⏳ Система завантажується...</div>
    </div>

    <div class="card">
        <div id="logspot-board" data-logspot-board="rating"></div>
    </div>
</div>

<script async data-logspot-pk="pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj" src="https://cdn.logspot.io/lg.js"></script>

<script>
    // Перевірка готовності скрипта кожну секунду
    const checkInterval = setInterval(() => {
        if (window.Logspot || window.logspot) {
            const btn = document.getElementById('sendBtn');
            const st = document.getElementById('status');
            btn.disabled = false;
            btn.classList.add('ready');
            btn.innerText = "Додати";
            st.innerText = "✅ Система готова до роботи";
            st.style.color = "#4ade80";
            clearInterval(checkInterval);
        }
    }, 1000);

    function sendData() {
        const input = document.getElementById('chanInput');
        const status = document.getElementById('status');
        const val = input.value.trim();

        if (!val) {
            status.innerText = "⚠️ Введи назву каналу!";
            status.style.color = "#fbbf24";
            return;
        }

        try {
            const lg = window.Logspot || window.logspot;
            // Використовуємо вбудований метод бібліотеки
            lg.event('new_submission', { name: val });
            
            status.innerText = "✅ Надіслано! Перевір адмінку Logspot.";
            status.style.color = "#4ade80";
            input.value = "";
        } catch (e) {
            status.innerText = "❌ Помилка відправки. Спробуй оновити сторінку.";
            status.style.color = "#f87171";
        }
    }
</script>

</body>
</html>
