<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Lottery - Рейтинг</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #3b82f6; font-size: 24px; margin-bottom: 20px; }
        .input-group { display: flex; gap: 8px; margin-top: 15px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        #status { margin-top: 15px; font-size: 14px; min-height: 20px; color: #94a3b8; }
        #logspot-board { min-height: 400px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Рейтинг UA Каналів</h1>

    <div class="card">
        <h3>Додати свій канал:</h3>
        <div class="input-group">
            <input type="text" id="chanInput" placeholder="Посилання або @username">
            <button onclick="send()">Додати</button>
        </div>
        <div id="status"></div>
    </div>

    <div class="card">
        <div id="logspot-board" data-logspot-board="rating"></div>
    </div>
</div>

<script async data-logspot-pk="pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj" src="https://cdn.logspot.io/lg.js"></script>

<script>
    function send() {
        const val = document.getElementById('chanInput').value.trim();
        const status = document.getElementById('status');

        if (!val) {
            status.innerText = "⚠️ Введи назву каналу!";
            return;
        }

        status.innerText = "Відправка...";

        // Використовуємо максимально простий метод відправки події
        if (window.logspot) {
            window.logspot.event("submission", { metadata: { channel: val } });
            status.innerText = "✅ Надіслано! Зачекай 1 хвилину та перевір Events.";
            status.style.color = "#4ade80";
            document.getElementById('chanInput').value = "";
        } else {
            status.innerText = "❌ Помилка: зачекай 3 сек, поки сторінка "прокинеться".";
            status.style.color = "#f87171";
        }
    }
</script>

</body>
</html>
