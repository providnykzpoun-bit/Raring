<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UA Lottery - Рейтинг</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        input { padding: 10px; border-radius: 8px; border: none; width: 70%; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        #logspot-board { min-height: 300px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 Рейтинг Каналів</h1>

    <div class="card">
        <h3>Додати свій канал:</h3>
        <input type="text" id="channelName" placeholder="@назва_каналу">
        <button onclick="sendToLogspot()">Додати</button>
        <p id="status" style="font-size: 12px; color: #94a3b8;"></p>
    </div>

    <div class="card">
        <div id="logspot-board" data-logspot-board="rating"></div>
    </div>
</div>

<script>
    async function sendToLogspot() {
        const name = document.getElementById('channelName').value;
        const status = document.getElementById('status');
        
        if (!name) return alert('Введи назву!');

        status.innerText = 'Відправляємо...';

        const response = await fetch('https://api.logspot.io/v1/events', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Logspot-PK': 'pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj',
                'X-Logspot-SK': 'sk_a6GAP1Y507HsaAkZMIq9t44lGnlToJVV0aJCvr31'
            },
            body: JSON.stringify({
                channel: "rating",
                event: "new_channel",
                message: name
            })
        });

        if (response.ok) {
            status.innerText = '✅ Готово! Онови сторінку за хвилину.';
            document.getElementById('channelName').value = '';
        } else {
            status.innerText = '❌ Помилка. Спробуй ще раз.';
        }
    }
</script>

<script async data-logspot-pk="pk_Py2TezzB4NwdQmGiCYoGfBs3Fl0uSOkg6_qsCtXj" src="https://cdn.logspot.io/lg.js"></script>

</body>
</html>
