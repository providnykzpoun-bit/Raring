<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг Телеграм Каналів</title>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; text-align: center; margin: 0; padding: 10px; }
        .header-table { width: 100%; border-collapse: collapse; background: #6366f1; color: white; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .header-table th, .header-table td { padding: 12px; border: 1px solid #4f46e5; }
        .form-container { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-title { background: #6366f1; color: white; padding: 10px; border-radius: 8px 8px 0 0; margin: -15px -15px 15px -15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🏆 Топ Телеграм Каналів</h2>

    <table class="header-table">
        <tr>
            <th>Місце</th>
            <th>Назва каналу</th>
            <th>Посилання</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Приклад каналу</td>
            <td><a href="#" style="color: white;">@example</a></td>
        </tr>
    </table>

    <div class="form-container">
        <div class="form-title">Додати свій канал до списку</div>
        <iframe 
            src="https://docs.google.com/forms/d/e/1FAIpQLSej-7DpeTU6h2JRdAWJoLXhDaQeU9C4mfkUUT_vMjFt7vvdoA/viewform?embedded=true" 
            width="100%" 
            height="800" 
            frameborder="0" 
            marginheight="0" 
            marginwidth="0">
            Завантаження...
        </iframe>
    </div>

</body>
</html>
